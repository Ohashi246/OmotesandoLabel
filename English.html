<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英語教育に関する実績 | Omotesando Label</title>

</head>
<body>
    <div class="container">
    <h1>英語教育に関する実績</h1>
    <div class="section">
        <h2>English Education Achievements</h2>
    </div>
    <div class="photo-grid" style="display:flex; flex-wrap:wrap; gap:32px; margin-top:32px;">
        <div class="photo-item" style="display:flex; align-items:flex-start;">
            <img src="EnJour.jpg" alt="EnJour" style="width:220px; max-width:100%; margin-right:24px; border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,0.12);">
            <div class="photo-caption" style="max-width:400px;">
                <div class="caption-desc" style="font-size:1em; color:#333; text-align:left; white-space:normal;">もっとも有名な英語専門誌“English Journal(2019年2月号)”に英語教師として紹介される。(2019)</div>
            </div>
        </div>
        <div class="photo-grid" style="display:flex; flex-wrap:wrap; gap:32px; margin-top:32px;">
            <div class="photo-item" style="display:flex; align-items:flex-start;">
                <img src="NYU.jpg" alt="NYU" style="width:220px; max-width:100%; margin-right:24px; border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,0.12);">
                <div class="photo-caption" style="max-width:400px;">
                    <div class="caption-desc" style="font-size:1em; color:#333; text-align:left; white-space:normal;">英語教員国内40人選抜して開催するアメリカ大使館主催ニューヨーク大学英語教授法セミナーの審査に合格（中学高校英語教師126名受験）。アメリカ政府の奨学金で受講。(2017)</div>
                </div>
