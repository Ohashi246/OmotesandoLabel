<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <title>Volunteer Activities | ボランティア活動</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
    <h1>社会貢献活動</h1>
        <div class="section">
            <h2>Volunteer Activities</h2>
            <p style="font-size:1em; color:#E0E0E0; margin-top:16px; text-align:left;">■ 東日本大震災直後の被災地訪問</p>
        <div class="photo-grid" style="margin-top:24px;">
            <div class="photo-item">
                <a href="#" onclick="openPopup('Kesen.jpg'); return false;"><img src="Kesen.jpg" alt="Kesen" style="width:100%;max-width:220px;"></a>
                <div class="photo-caption">
                    <div class="caption-desc">宮城県気仙沼市のショッピングモールなどでボランティア活動をしました。</div>
                </div>
            </div>
            <div class="photo-item">
                <a href="#" onclick="openPopup('Ofunato.jpg'); return false;"><img src="Ofunato.jpg" alt="Ofunato" style="width:100%;max-width:220px;"></a>
                <div class="photo-caption">
                    <div class="caption-desc">岩手県大船渡市の仮設住宅を訪問・演奏。</div>
                </div>
            </div>
            <div class="photo-item">
                <a href="#" onclick="openPopup('Rikuzen.jpg'); return false;"><img src="Rikuzen.jpg" alt="Rikuzen" style="width:100%;max-width:220px;"></a>
                <div class="photo-caption">
                    <div class="caption-desc">岩手県陸前高田市の仮設住宅を訪問・演奏。</div>
                </div>
            </div>
        </div>
            <p style="font-size:1em; color:#E0E0E0; margin-top:24px; text-align:left;">■ コロナ禍の緊急事態宣言中、病院で医療に従事</p>
        <div class="photo-grid" style="margin-top:16px;">
            <div class="photo-item">
                <a href="#" onclick="openPopup('Covid19.jpg'); return false;"><img src="Covid19.jpg" alt="Covid19" style="width:100%;max-width:220px; border-radius:0px; box-shadow:0 4px 16px rgba(0,0,0,0.2);"></a>
                <div class="photo-caption">
                    <div class="caption-desc" style="color:#E0E0E0; max-width:220px; margin:0 auto; word-break:break-word; text-align:left; white-space:normal;">ナースステーション・診察室で働くという貴重な経験をしました。</div>
                </div>
            </div>
        </div>
        </div>
        <p style="font-size:1em; color:#E0E0E0; margin-top:24px; text-align:left;">■ 『みなとタバコルール宣言』登録</p>
        <div class="photo-grid" style="margin-top:16px;">
            <div class="photo-item">
                <a href="#" onclick="openPopup('Minato.jpg'); return false;"><img src="Minato.jpg" alt="Minato" style="width:100%;max-width:220px;"></a>
                <div class="photo-caption">
                    <div class="caption-desc">南青山・表参道エリアで歩きタバコのパトロールを実施しています。</div>
                </div>
            </div>
        </div>
    </div>
    <div id="popup" class="popup" style="display:none;">
        <img id="popup-img" src="" alt="popup" onclick="closePopup()" style="max-width:90vw; max-height:90vh; border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,0.7); cursor:pointer;">
    </div>
    <script>
    function openPopup(src) {
        var popup = document.getElementById('popup');
        var img = document.getElementById('popup-img');
        img.src = src;
        popup.style.display = 'flex';
        popup.style.position = 'fixed';
        popup.style.top = '0';
        popup.style.left = '0';
        popup.style.width = '100vw';
        popup.style.height = '100vh';
        popup.style.background = 'rgba(0,0,0,0.8)';
        popup.style.justifyContent = 'center';
        popup.style.alignItems = 'center';
        popup.style.zIndex = '9999';
    }
    function closePopup() {
        var popup = document.getElementById('popup');
        var img = document.getElementById('popup-img');
        img.src = '';
        popup.style.display = 'none';
    }
    </script>
</body>
</html>
                    </div>
                </div>
    </div>
</body>
</html>
