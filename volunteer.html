<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer Activities | ボランティア活動</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
            <div style="margin-top:40px; text-align:center; font-size:2em; font-weight:bold; color:#333;">
            <div class="title" style="margin-top:40px; text-align:center; color:#333; font-weight:bold;">
                ■ 東日本大震災直後の被災地訪問
            </div>
                <div class="section">
                    <h2>Photos</h2>
                </div>
                <div class="photo-grid">
                    <div class="photo-item">
                        <img src="Kesen.jpg" alt="Kesen" style="width:100%;max-width:220px;">
                        <div class="photo-caption">
                            <div class="caption-desc">気仙沼市：津波被害の爪痕が残る港町。地元の方々の力強い復興への歩み。</div>
                            <div class="caption-name">宮城県気仙沼市</div>
                        </div>
                    </div>
                    <div class="photo-item">
                        <img src="Rikuzen.jpg" alt="Rikuzen" style="width:100%;max-width:220px;">
                        <div class="photo-caption">
                            <div class="caption-desc">陸前高田市：一本松が象徴する町。多くのボランティアが支援活動に参加。</div>
                            <div class="caption-name">岩手県陸前高田市</div>
                        </div>
                    </div>
                    <div class="photo-item">
                        <img src="Ofunato.jpg" alt="Ofunato" style="width:100%;max-width:220px;">
                        <div class="photo-caption">
                            <div class="caption-desc">大船渡市：被災地の現状を伝えるため、現地で撮影した写真。</div>
                            <div class="caption-name">岩手県大船渡市</div>
                        </div>
                    </div>
                </div>
    </div>
</body>
</html>
