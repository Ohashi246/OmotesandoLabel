<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>写真ページ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>写真ギャラリー</h1>
        <div class="photo-grid">
                <div class="photo-item">
                    <a href="#" onclick="openPopup('IA.jpg'); return false;"><img src="IA.jpg" alt="IA"></a>
                    <div class="photo-caption">
                         <div class="caption-desc">TV特番で活躍する<br>ジャーナリスト</div>
                         <div class="caption-name">池上彰氏</div>
                    </div>
                </div>
                <div class="photo-item">
                    <a href="#" onclick="openPopup('JV.jpg'); return false;"><img src="JV.jpg" alt="JV"></a>
                    <div class="photo-caption">
                         <div class="caption-desc">「ZARA」創業者<br>世界的アパレルの立役者</div>
                         <div class="caption-name">ヘスス・ベガ氏</div>
                    </div>
                </div>
                <div class="photo-item">
                    <a href="#" onclick="openPopup('MT.jpg'); return false;"><img src="MT.jpg" alt="MT"></a>
                    <div class="photo-caption">
                         <div class="caption-desc">「マスターズドリーム」<br>醸造家</div>
                         <div class="caption-name">丸橋太一氏</div>
                    </div>
                </div>
                <div class="photo-item">
                    <a href="#" onclick="openPopup('PS.jpg'); return false;"><img src="PS.jpg" alt="PS"></a>
                    <div class="photo-caption">
                         <div class="caption-desc">イギリスの英雄的ファッション・デザイナー</div>
                         <div class="caption-name">ポール・スミス氏</div>
                    </div>
                </div>
        </div>

        <div id="popup" class="popup" style="display:none;">
            <img id="popup-img" src="" alt="popup" onclick="closePopup()" style="max-width:90vw; max-height:90vh; border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,0.7); cursor:pointer;">
        </div>
        <script>
        function openPopup(src) {
            var popup = document.getElementById('popup');
            var img = document.getElementById('popup-img');
            img.src = src;
            popup.style.display = 'flex';
            popup.style.position = 'fixed';
            popup.style.top = '0';
            popup.style.left = '0';
            popup.style.width = '100vw';
            popup.style.height = '100vh';
            popup.style.background = 'rgba(0,0,0,0.8)';
            popup.style.justifyContent = 'center';
            popup.style.alignItems = 'center';
            popup.style.zIndex = '9999';
        }
        function closePopup() {
            var popup = document.getElementById('popup');
            var img = document.getElementById('popup-img');
            img.src = '';
            popup.style.display = 'none';
        }
        </script>
</body>
</html>
